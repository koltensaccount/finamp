name: Catalog identity
on:
  pull_request:
  push:
    branches: [main, codex/catalog-identity]
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s backend/tests -v
